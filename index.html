<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصميم عملة ورقية رسمية - جاهزة للطباعة</title>
    <!-- استدعاء خطوط عربية فاخرة للنقود والوثائق الرسمية -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@600;800;900&family=Reem+Kufi:wght@700&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #1a1a1a;
            color: #1a252c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* حاوية العملة الورقية بمقاسات العملات الورقية الرسمية */
        .banknote {
            width: 780px;
            height: 380px;
            max-width: 100%;
            position: relative;
            background: #f4efe1; /* لون ورق النقود الفاخر */
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid #c8b27c;
            
            /* خلفية النقوش الهندسية المعقدة (Guilloche/Security Pattern) */
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(184, 134, 11, 0.08) 0%, transparent 70%),
                repeating-linear-gradient(45deg, rgba(27, 67, 50, 0.04) 0px, rgba(27, 67, 50, 0.04) 2px, transparent 2px, transparent 8px),
                repeating-linear-gradient(-45deg, rgba(184, 134, 11, 0.04) 0px, rgba(184, 134, 11, 0.04) 2px, transparent 2px, transparent 8px);
        }

        /* الإطار الأمني الخارجي المزخرف */
        .security-border {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 3px double #1b4332;
            outline: 2px solid #b8860b;
            outline-offset: -7px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.25);
        }

        /* الرأس: الجهة المصدرة والقيمة بالرقام */
        .banknote-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
        }

        .issuer-title {
            text-align: right;
        }

        .issuer-title h2 {
            font-family: 'Amiri', serif;
            font-size: 20px;
            color: #1b4332;
            letter-spacing: 0.5px;
        }

        .issuer-title h4 {
            font-size: 11px;
            color: #8b6b23;
            font-weight: 800;
        }

        .denomination-top {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 36px;
            font-weight: 900;
            color: #1b4332;
            text-shadow: 1px 1px 0px #b8860b;
            line-height: 1;
        }

        /* منتصف العملة: الفئة الرئيسية والشريط الأمني والعلامة المائية */
        .banknote-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 2;
            margin: 10px 0;
        }

        /* الشريط الهولوغرامي الأمني (Holographic Security Thread) */
        .security-thread {
            position: absolute;
            right: 220px;
            top: -50px;
            bottom: -50px;
            width: 14px;
            background: linear-gradient(180deg, 
                #b8860b 0%, 
                #e6ca65 25%, 
                #1b4332 50%, 
                #e6ca65 75%, 
                #b8860b 100%);
            opacity: 0.65;
            box-shadow: 0 0 4px rgba(0,0,0,0.3);
            transform: rotate(2deg);
        }

        /* نافذة العلامة المائية */
        .watermark-window {
            width: 110px;
            height: 140px;
            border: 2px dashed rgba(184, 134, 11, 0.4);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.3);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        .watermark-window span {
            font-size: 10px;
            color: rgba(27, 67, 50, 0.4);
            font-weight: bold;
        }

        /* الفئة الرئيسية بالنص */
        .main-value-box {
            text-align: center;
            flex-grow: 1;
        }

        .value-number {
            font-family: 'Cairo', sans-serif;
            font-size: 72px;
            font-weight: 900;
            color: #1b4332;
            line-height: 1;
            text-shadow: 2px 2px 0px #e6ca65, 4px 4px 0px rgba(27, 67, 50, 0.15);
        }

        .value-text {
            font-family: 'Amiri', serif;
            font-size: 22px;
            font-weight: bold;
            color: #705315;
            margin-top: 5px;
        }

        .serial-number {
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            color: #a
