<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark scroll-smooth">
<head>
    <meta charset="UTF-8">

    <title>معرض روائع الحكمة والأدب العربي - مؤمن القصاص</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: {
                            50: '#fffbe1',
                            100: '#fef3c7',
                            200: '#fde68a',
                            300: '#fcd34d',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            800: '#92400e',
                            900: '#78350f',
                            950: '#451a03',
                        },
                        obsidian: {
                            950: '#070609',
                            900: '#0c0a0f',
                            800: '#14111a',
                            700: '#1e1a26',
                            600: '#2a2436',
                        }
                    },
                    fontFamily: {
                        amiri: ['Amiri', 'serif'],
                        cairo: ['Cairo', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0c0a0f;
            color: #fef3c7;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(217, 119, 6, 0.15), transparent),
                radial-gradient(circle at 100% 100%, rgba(120, 53, 15, 0.08), transparent 50%),
                radial-gradient(circle at 0% 50%, rgba(245, 158, 11, 0.05), transparent 40%);
            background-attachment: fixed;
        }

        .font-amiri {
            font-family: 'Amiri', serif;
        }

        /* Luxury Gold Gradients & Borders */
        .gold-gradient-text {
            background: linear-gradient(135deg, #fffbe1 0%, #fcd34d 40%, #f59e0b 70%, #b45309 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-border-glow {
            box-shadow: 0 0 25px -5px rgba(245, 158, 11, 0.12), inset 0 0 15px rgba(245, 158, 11, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.25);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .gold-border-glow:hover {
            box-shadow: 0 12px 35px -8px rgba(245, 158, 11, 0.22), inset 0 0 20px rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.5);
        }

        /* Frame Display for Original Resolution Images */
        .luxury-image-frame {
            position: relative;
            background: #050406;
            border-radius: 1rem;
            overflow: hidden;
            border: 1px solid rgba(245, 158, 11, 0.3);
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
        }

        .luxury-image-frame img {
            width: 100%;
            height: auto;
            max-height: 80vh;
            object-fit: contain;
            display: block;
            transition: transform 0.5s ease;
        }

        .luxury-image-frame:hover img {
            transform: scale(1.015);
        }

        /* Custom Golden Scrollbar */
        ::-webkit-scrollbar { width: 7px; }
        ::-webkit-scrollbar-track { background: #0c0a0f; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(to bottom, #d97706, #78350f); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }

        @keyframes heartPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
        .pulse-heart { animation: heartPulse 0.3s ease-out; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-obsidian-950">

    <!-- Top Floating Header -->
    <header class="sticky top-0 z-40 bg-obsidian-900/85 backdrop-blur-md border-b border-amber-500/20 shadow-xl">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <!-- Logo & Brand Info -->
            <div class="flex items-center space-x-3.5 space-x-reverse">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-amber-400 via-amber-600 to-amber-900 p-0.5 shadow-lg shadow-amber-600/20 flex items-center justify-center">
                    <div class="w-full h-full bg-obsidian-900 rounded-[14px] flex items-center justify-center">
                        <i class="fa-solid fa-feather-pointed text-amber-400 text-lg"></i>
                    </div>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold font-amiri gold-gradient-text tracking-wide">
                        معرض روائع الحكمة والأدب العربي
                    </h1>
                    <p class="text-xs text-amber-200/60 font-medium">
                        تصميم وإعداد: <span class="text-amber-400 font-semibold">مؤمن القصاص</span>
                    </p>
                </div>
            </div>

            <!-- Saved Counter Button -->
            <div class="flex items-center space-x-2 space-x-reverse">
                <button onclick="setFilter('bookmarks')" id="bookmarksToggleBtn" class="px-4 py-2 rounded-xl bg-obsidian-800 hover:bg-amber-500/20 text-amber-200 border border-amber-500/30 transition-all flex items-center space-x-2 space-x-reverse text-xs sm:text-sm font-semibold shadow-inner">
                    <i class="fa-solid fa-bookmark text-amber-400"></i>
                    <span>المفضلة</span>
                    <span id="savedBadge" class="bg-amber-500 text-obsidian-950 font-extrabold text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-8 space-y-8">

        <!-- Search Bar & Category Filters -->
        <section class="space-y-4">
            <!-- Search Input -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-amber-500/60 text-sm"></i>
                <input type="text" id="searchInput" oninput="renderCards()" placeholder="ابحث باسم الشاعر أو الموضوع أو نوع الشعر..." class="w-full pl-4 pr-11 py-3.5 rounded-2xl bg-obsidian-800/90 border border-amber-500/25 text-amber-100 placeholder-amber-200/40 text-sm focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400/50 transition-all shadow-inner">
            </div>

            <!-- Filter Buttons -->
            <div class="flex items-center justify-center flex-wrap gap-2 text-xs sm:text-sm">
                <button onclick="setFilter('all')" id="btn-filter-all" class="filter-tab active-tab px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-obsidian-950 font-bold shadow-md shadow-amber-500/20 transition-all">
                    الكل
                </button>
                <button onclick="setFilter('المتنبي')" id="btn-filter-almutanabbi" class="filter-tab px-4 py-2 rounded-xl bg-obsidian-800 text-amber-200 hover:bg-amber-500/15 border border-amber-500/20 transition-all">
                    المتنبي
                </button>
                <button onclick="setFilter('الإمام الشافعي')" id="btn-filter-shafi" class="filter-tab px-4 py-2 rounded-xl bg-obsidian-800 text-amber-200 hover:bg-amber-500/15 border border-amber-500/20 transition-all">
                    الإمام الشافعي
                </button>
                <button onclick="setFilter('bookmarks')" id="btn-filter-bookmarks" class="filter-tab px-4 py-2 rounded-xl bg-obsidian-800 text-amber-200 hover:bg-amber-500/15 border border-amber-500/20 transition-all flex items-center space-x-1.5 space-x-reverse">
                    <i class="fa-solid fa-heart text-red-500"></i>
                    <span>المفضلة المحفوظة</span>
                </button>
            </div>
        </section>

        <!-- Vertical Feed Container -->
        <div id="cardsFeed" class="space-y-12">
            <!-- Dynamically Rendered -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="mt-16 border-t border-amber-500/20 bg-obsidian-900 py-8 text-center text-xs text-amber-200/50">
        <div class="max-w-3xl mx-auto px-4 space-y-3">
            <div class="flex items-center justify-center space-x-2 space-x-reverse text-amber-400 font-bold text-sm sm:text-base">
                <i class="fa-solid fa-thumbtack text-red-500 transform rotate-45"></i>
                <span class="font-amiri text-lg">تصميم وإعداد: مؤمن القصاص</span>
            </div>
            <p class="leading-relaxed">جميع الصور مُنسقة بجودتها الكاملة الأصلية للحفاظ على رونق الخط والتصميم الأدبي</p>
            <p class="text-amber-500/40">&copy; <span id="currentYear"></span> جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <!-- Toast Notification Overlay -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-obsidian-800 text-amber-100 border border-amber-500/50 px-6 py-3.5 rounded-2xl shadow-2xl backdrop-blur-xl flex items-center space-x-3 space-x-reverse opacity-0 pointer-events-none transition-all duration-300">
        <i id="toastIcon" class="fa-solid fa-circle-check text-amber-400 text-lg"></i>
        <span id="toastMessage" class="text-xs sm:text-sm font-semibold"></span>
    </div>

    <!-- High-Res Lightbox Modal -->
    <div id="lightbox" class="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl hidden flex flex-col items-center justify-between p-4 sm:p-6 transition-all duration-300">
        <div class="w-full flex items-center justify-between max-w-5xl">
            <div class="flex items-center space-x-2 space-x-reverse">
                <i class="fa-solid fa-crown text-amber-400"></i>
                <span id="lightboxTitle" class="text-amber-200 font-amiri text-lg sm:text-xl font-bold"></span>
            </div>
            <button onclick="closeLightbox()" aria-label="إغلاق المعرض" class="text-amber-200/70 hover:text-white bg-obsidian-800/80 p-2.5 rounded-full border border-amber-500/30 hover:bg-amber-500/30 transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <div class="flex-grow flex items-center justify-center w-full my-auto overflow-hidden p-2">
            <img id="lightboxImg" src="" alt="صورة بالحجم الكامل" class="max-h-[82vh] max-w-full object-contain rounded-2xl shadow-2xl border border-amber-500/30">
        </div>

        <div class="pb-2 text-center">
            <a id="lightboxDownloadBtn" href="" download="" target="_blank" class="px-6 py-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-obsidian-950 font-bold text-sm shadow-xl hover:brightness-110 transition-all inline-flex items-center space-x-2 space-x-reverse">
                <i class="fa-solid fa-download"></i>
                <span>تنزيل الصورة بالجودة العالية</span>
            </a>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        // Strictly Provided Image Dataset
        const poetryCards = [
            {
                id: 'almutanabbi-desires',
                author: 'المتنبي',
                authorAvatar: 'fa-feather',
                topic: 'في الحكمة والقدر والطموح',
                category: 'حكم وأمثال',
                imageUrl: 'https://i.postimg.cc/67rMNcHX/IMG-20261028-144628.png',
                defaultLikes: 482,
                filename: 'almutanabbi-winds-quote.png'
            },
            {
                id: 'shafi-people-wealth',
                author: 'الإمام الشافعي',
                authorAvatar: 'fa-book-quran',
                topic: 'في طبيعة الناس وتذبذب الود بالمادة',
                category: 'فلسفة ودنيا',
                imageUrl: 'https://i.postimg.cc/JyNpWxTh/IMG-20261028-150015.png',
                defaultLikes: 619,
                filename: 'alshafi-people-wealth-quote.png'
            },
            {
                id: 'shafi-contentment-fate',
                author: 'الإمام الشافعي',
                authorAvatar: 'fa-scale-balanced',
                topic: 'في القناعة والرضا بحكم القضاء',
                category: 'قناعة ورضا',
                imageUrl: 'https://i.postimg.cc/yJmLzjfY/IMG-20261028-151540.png',
                defaultLikes: 835,
                filename: 'alshafi-fate-contentment-quote.png'
            }
        ];

        let activeFilter = 'all';

        // LocalStorage Helpers
        function getCardState(id) {
            const stored = localStorage.getItem('arabic_poetry_' + id);
            return stored ? JSON.parse(stored) : { liked: false, saved: false, extraLikes: 0 };
        }

        function saveCardState(id, state) {
            localStorage.setItem('arabic_poetry_' + id, JSON.stringify(state));
            updateSavedBadge();
        }

        function updateSavedBadge() {
            let count = 0;
            poetryCards.forEach(c => {
                if (getCardState(c.id).saved) count++;
            });
            document.getElementById('savedBadge').textContent = count;
        }

        // Render Feed Logic
        function renderCards() {
            const feed = document.getElementById('cardsFeed');
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            feed.innerHTML = '';

            const filtered = poetryCards.filter(card => {
                const cardState = getCardState(card.id);
                
                let filterMatch = false;
                if (activeFilter === 'all') filterMatch = true;
                else if (activeFilter === 'bookmarks') filterMatch = cardState.saved;
                else filterMatch = (card.author === activeFilter);

                const searchMatch = card.author.toLowerCase().includes(query) ||
                                    card.topic.toLowerCase().includes(query) ||
                                    card.category.toLowerCase().includes(query);

                return filterMatch && searchMatch;
            });

            if (filtered.length === 0) {
                feed.innerHTML = `
                    <div class="text-center py-16 bg-obsidian-800/40 rounded-3xl border border-amber-500/10">
                        <i class="fa-solid fa-scroll text-4xl text-amber-500/30 mb-3 block"></i>
                        <p class="text-amber-200/60 font-medium">لا توجد بطاقات أثرية مطابقة لهذا البحث أو التصفية.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach((card, index) => {
                const state = getCardState(card.id);
                const totalLikes = card.defaultLikes + (state.extraLikes || 0);

                const cardElement = document.createElement('article');
                cardElement.className = 'gold-border-glow bg-obsidian-800/90 rounded-3xl overflow-hidden backdrop-blur-md transition-all duration-300';
                
                cardElement.innerHTML = `
                    <!-- Header Bar (Top metadata only - NO text below image) -->
                    <div class="p-5 sm:p-6 bg-obsidian-900/95 border-b border-amber-500/20 flex flex-wrap items-center justify-between gap-3">
                        <div class="flex items-center space-x-3.5 space-x-reverse">
                            <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 shadow-inner">
                                <i class="fa-solid ${card.authorAvatar} text-base"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-base sm:text-lg text-amber-100 font-amiri tracking-wide">${card.topic}</h3>
                                <div class="flex items-center space-x-2 space-x-reverse text-xs text-amber-200/60 mt-0.5">
                                    <span>الشاعر:</span>
                                    <span class="text-amber-300 font-bold">${card.author}</span>
                                </div>
                            </div>
                        </div>

                        <span class="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-amber-500/10 text-amber-300 border border-amber-500/25 shadow-sm">
                            ${card.category}
                        </span>
                    </div>

                    <!-- Image Container (Full Resolution Display) -->
                    <div class="p-4 sm:p-6 bg-obsidian-950/60">
                        <div class="luxury-image-frame cursor-pointer group" onclick="openLightbox('${card.imageUrl}', '${card.topic}', '${card.filename}')">
                            <img src="${card.imageUrl}" 
                                 alt="${card.topic}" 
                                 loading="lazy"
                                 onerror="this.onerror=null; this.src='https://placehold.co/800x450/14111a/f59e0b?text=روائع+الأدب+العربي';">
                            
                            <!-- Hover Interactive Overlay -->
                            <div class="absolute inset-0 bg-obsidian-950/50 opacity-0 group-hover:opacity-100 transition-all duration-300 flex items-center justify-center backdrop-blur-[2px]">
                                <span class="bg-gradient-to-r from-amber-500 to-amber-600 text-obsidian-950 font-extrabold px-5 py-2.5 rounded-2xl text-xs sm:text-sm shadow-2xl flex items-center space-x-2 space-x-reverse transform translate-y-3 group-hover:translate-y-0 transition-transform">
                                    <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
                                    <span>تكبير الصورة بالجودة الأصلية</span>
                                </span>
                            </div>
                        </div>
                    </div>

                    <!-- Action Control Bar -->
                    <div class="px-5 py-4 bg-obsidian-900/80 border-t border-amber-500/15 flex items-center justify-between gap-3 flex-wrap">
                        
                        <!-- Like & Save Controls -->
                        <div class="flex items-center space-x-2 space-x-reverse">
                            <!-- Like Button -->
                            <button onclick="toggleLike('${card.id}')" class="px-4 py-2.5 rounded-xl bg-obsidian-700/80 hover:bg-amber-500/20 text-amber-200 border border-amber-500/20 transition-all flex items-center space-x-2 space-x-reverse text-xs sm:text-sm font-semibold">
                                <i id="like-icon-${card.id}" class="${state.liked ? 'fa-solid text-red-500 pulse-heart' : 'fa-regular'} fa-heart text-base"></i>
                                <span id="like-count-${card.id}" class="font-bold">${totalLikes}</span>
                            </button>

                            <!-- Bookmark Button -->
                            <button onclick="toggleSave('${card.id}')" class="px-4 py-2.5 rounded-xl bg-obsidian-700/80 hover:bg-amber-500/20 text-amber-200 border border-amber-500/20 transition-all flex items-center space-x-2 space-x-reverse text-xs sm:text-sm font-semibold">
                                <i id="save-icon-${card.id}" class="${state.saved ? 'fa-solid text-amber-400' : 'fa-regular'} fa-bookmark text-base"></i>
                                <span>${state.saved ? 'محفوظة' : 'حفظ'}</span>
                            </button>
                        </div>

                        <!-- Copy & Download Controls -->
                        <div class="flex items-center space-x-2 space-x-reverse">
                            <!-- Copy Link Button -->
                            <button onclick="copyImageLink('${card.imageUrl}')" class="px-4 py-2.5 rounded-xl bg-obsidian-700/80 hover:bg-amber-500/20 text-amber-200 border border-amber-500/20 transition-all flex items-center space-x-2 space-x-reverse text-xs sm:text-sm font-semibold">
                                <i class="fa-regular fa-copy text-base"></i>
                                <span class="hidden sm:inline">نسخ الرابط</span>
                            </button>

                            <!-- Download Image -->
                            <a href="${card.imageUrl}" target="_blank" download="${card.filename}" onclick="triggerToast('جاري بدء تحميل الصورة عالية الدقة...', 'download')" class="px-4 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:brightness-110 text-obsidian-950 font-bold transition-all flex items-center space-x-2 space-x-reverse text-xs sm:text-sm shadow-md">
                                <i class="fa-solid fa-download"></i>
                                <span>تحميل</span>
                            </a>
                        </div>
                    </div>
                `;
                feed.appendChild(cardElement);
            });
        }

        // Like Toggle
        function toggleLike(id) {
            const state = getCardState(id);
            state.liked = !state.liked;
            state.extraLikes = state.liked ? 1 : 0;
            saveCardState(id, state);

            const card = poetryCards.find(c => c.id === id);
            const totalLikes = card.defaultLikes + state.extraLikes;

            const icon = document.getElementById(`like-icon-${id}`);
            const count = document.getElementById(`like-count-${id}`);

            if (state.liked) {
                icon.className = 'fa-solid fa-heart text-red-500 pulse-heart text-base';
                triggerToast('تم تسجيل إعجابك بهذه اللوحة', 'heart');
            } else {
                icon.className = 'fa-regular fa-heart text-base';
                triggerToast('تم إزالة الإعجاب', 'info');
            }
            count.textContent = totalLikes;
        }

        // Bookmark Toggle
        function toggleSave(id) {
            const state = getCardState(id);
            state.saved = !state.saved;
            saveCardState(id, state);

            if (state.saved) {
                triggerToast('تم حفظ الصورة في قائمة المفضلة', 'bookmark');
            } else {
                triggerToast('تمت إزالة الصورة من المفضلة', 'info');
            }
            renderCards();
        }

        // Copy Image Link
        function copyImageLink(url) {
            const temp = document.createElement('input');
            temp.value = url;
            document.body.appendChild(temp);
            temp.select();
            
            try {
                document.execCommand('copy');
                triggerToast('تم نسخ رابط الصورة المباشر بنجاح!', 'copy');
            } catch (err) {
                triggerToast('تعذر النسخ التلقائي', 'info');
            }
            document.body.removeChild(temp);
        }

        // Toast Feedback System
        let toastTimer;
        function triggerToast(message, type = 'check') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');
            const iconEl = document.getElementById('toastIcon');

            msgEl.textContent = message;

            if (type === 'heart') iconEl.className = 'fa-solid fa-heart text-red-500 text-lg';
            else if (type === 'bookmark') iconEl.className = 'fa-solid fa-bookmark text-amber-400 text-lg';
            else if (type === 'copy') iconEl.className = 'fa-solid fa-copy text-amber-300 text-lg';
            else if (type === 'download') iconEl.className = 'fa-solid fa-circle-down text-emerald-400 text-lg';
            else iconEl.className = 'fa-solid fa-circle-info text-amber-400 text-lg';

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2800);
        }

        // Filter Switcher
        function setFilter(filter) {
            activeFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(btn => {
                btn.className = 'filter-tab px-4 py-2 rounded-xl bg-obsidian-800 text-amber-200 hover:bg-amber-500/15 border border-amber-500/20 transition-all';
            });

            if (filter === 'all') document.getElementById('btn-filter-all').className = 'filter-tab active-tab px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-obsidian-950 font-bold shadow-md shadow-amber-500/20 transition-all';
            else if (filter === 'المتنبي') document.getElementById('btn-filter-almutanabbi').className = 'filter-tab active-tab px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-obsidian-950 font-bold shadow-md shadow-amber-500/20 transition-all';
            else if (filter === 'الإمام الشافعي') document.getElementById('btn-filter-shafi').className = 'filter-tab active-tab px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-obsidian-950 font-bold shadow-md shadow-amber-500/20 transition-all';
            else if (filter === 'bookmarks') document.getElementById('btn-filter-bookmarks').className = 'filter-tab active-tab px-4 py-2 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 text-obsidian-950 font-bold shadow-md shadow-amber-500/20 transition-all flex items-center space-x-1.5 space-x-reverse';

            renderCards();
        }

        // Lightbox Functions
        function openLightbox(url, title, filename) {
            const lightbox = document.getElementById('lightbox');
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightboxTitle').textContent = title;
            const dlBtn = document.getElementById('lightboxDownloadBtn');
            dlBtn.href = url;
            dlBtn.download = filename;

            lightbox.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Initialize App
        window.onload = function() {
            renderCards();
            updateSavedBadge();
        };
    </script>
