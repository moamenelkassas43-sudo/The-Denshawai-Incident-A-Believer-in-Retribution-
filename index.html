<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوستر دعم وتاييد الرئيس عبد الفتاح السيسي</title>
    <!-- استيراد خطوط عربية احترافية من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e5e7eb;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* حاوية البوستر بمقاييس الطباعة القياسية */
        .poster-container {
            width: 800px;
            height: 1130px;
            background: linear-gradient(135deg, #ffffff 0%, #fcfbf9 100%);
            border: 12px solid #111;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
        }

        /* إطار الألوان الوطنية المنسق على الجوانب */
        .poster-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 25px;
            height: 100%;
            background: linear-gradient(to bottom, #c0392b 33%, #ffffff 33%, #ffffff 66%, #111111 66%);
            z-index: 2;
        }

        .poster-container::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 25px;
            height: 100%;
            background: linear-gradient(to bottom, #111111 33%, #ffffff 33%, #ffffff 66%, #c0392b 66%);
            z-index: 2;
        }

        /* الهيدر والعنوان الرئيسي */
        .header-section {
            text-align: center;
            z-index: 3;
            margin-top: 10px;
        }

        .main-title {
            font-family: 'Amiri', serif;
            font-size: 64px;
            font-weight: 700;
            color: #b8860b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
        }

        .main-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 3px;
            background: #c0392b;
            border-radius: 2px;
        }

        /* قسم الصورة الشخصية والخلفية الجمالية */
        .hero-section {
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            z-index: 3;
        }

        .bg-landmarks {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: url('https://i.postimg.cc/4Nsp2XPv/IMG-4f487f84-bce5-4e64-8b06-4e9d07c73c16.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.85;
            border-radius: 15px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.3);
            border: 4px solid #b8860b;
        }

        .overlay-gradient {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.1) 50%, rgba(255,255,255,0.2) 100%);
            border-radius: 12px;
        }

        /* شعار أو نص التأسيس والتأييد داخل الصورة أو أسفلها */
        .slogan-section {
            text-align: center;
            z-index: 3;
            background: rgba(255, 255, 255, 0.92);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #b8860b;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .slogan-ar {
            font-size: 32px;
            font-weight: 900;
            color: #1a1a1a;
            margin-bottom: 5px;
        }

        .slogan-name {
            font-size: 36px;
            font-weight: 900;
            color: #c0392b;
            letter-spacing: 1px;
        }

        .slogan-en {
            font-size: 20px;
            font-weight: 700;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 8px;
        }

        /* الفوتر السفلي */
        .footer-section {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
            font-weight: 600;
            z-index: 3;
            border-top: 1px solid #e5e7eb;
            padding-top: 10px;
        }

        /* زر الطباعة (يختفي عند الطباعة الفعلية) */
        .print-btn-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }

        .print-btn {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(192, 57, 43, 0.4);
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .print-btn:hover {
            background-color: #962d22;
            transform: translateY(-2px);
        }

        @media print {
            body {
                background: none;
                padding: 0;
            }
            .print-btn-container {
                display: none;
            }
            .poster-container {
                box-shadow: none;
                border: 8px solid #111;
                width: 100%;
                height: 100vh;
            }
        }
    </style>
</head>
<body>

    <!-- زر الطباعة -->
    <div class="print-btn-container">
        <button class="print-btn" onclick="window.print()">🖨️ طباعة البوستر بجودة عالية</button>
    </div>

    <!-- البوستر الرئيسي -->
    <div class="poster-container">
        
        <!-- العنوان العلوي -->
        <div class="header-section">
            <h1 class="main-title">تحيا مصر</h1>
        </div>

        <!-- منطقة الصورة والخلفية الوطنية -->
        <div class="hero-section">
            <div class="bg-landmarks"></div>
            <div class="overlay-gradient"></div>
        </div>

        <!-- النصوص والشعارات الترويجية -->
        <div class="slogan-section">
            <div class="slogan-ar">معاً لمستقبل أفضل</div>
            <div class="slogan-name">للرئيس عبد الفتاح السيسي</div>
            <div class="slogan-en">For a Stronger Egypt • Vote El-Sisi</div>
        </div>

        <!-- الفوتر -->
        <div class="footer-section">
            <p>دعم وتأييد مسيرة التنمية والبناء والاستقرار</p>
        </div>

    </div>

</body>
</html>
