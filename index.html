<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عملة تذكارية رسمية - ماسبيرو</title>
    <!-- خطوط عربية فاخرة للوثائق والنقود الرسمية -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@600;800;900&family=Reem+Kufi:wght@700&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0d1b2a;
            color: #1a252c;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* حاوية العملة الورقية (أبعاد بانورامية للنقود) */
        .banknote {
            width: 820px;
            height: 390px;
            max-width: 100%;
            position: relative;
            background: #f4efe1; /* لون ورق النقد الرسمي */
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
            border: 2px solid #d4af37;
            
            /* دمج صورة الخلفية العامة مع نقوش النقود الأمنية */
            background-image: 
                linear-gradient(rgba(10, 25, 47, 0.75), rgba(10, 25, 47, 0.75)),
                url('https://i.postimg.cc/XvMb7FN7/IMG-946cbdd7-64a2-4682-91ec-d62be5b50196.webp');
            background-size: cover;
            background-position: center;
        }

        /* الإطار الأمني الداخلي */
        .security-border {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 2px double #d4af37;
            outline: 1px solid rgba(255, 255, 255, 0.3);
            outline-offset: -5px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(13, 27, 42, 0.45);
            backdrop-filter: blur(4px);
        }

        /* الشريط الهولوغرامي الأمني العمودي */
        .security-thread {
            position: absolute;
            right: 250px;
            top: -20px;
            bottom: -20px;
            width: 12px;
            background: linear-gradient(180deg, #d4af37 0%, #ffffff 50%, #d4af37 100%);
            opacity: 0.6;
            transform: rotate(3deg);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.8);
        }

        /* رأس العملة */
        .banknote-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            padding-bottom: 10px;
        }

        .issuer-title h2 {
            font-family: 'Amiri', serif;
            font-size: 18px;
            color: #d4af37;
            letter-spacing: 0.5px;
        }

        .issuer-title h4 {
            font-size: 11px;
            color: #cbd5e1;
            font-weight: 600;
        }

        /* شعار الهيئة المعزول في الزاوية */
        .logo-box {
            width: 50px;
            height: 50px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3px;
            border: 1px solid #d4af37;
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        .denomination-top {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 30px;
            font-weight: 900;
            color: #f1c40f;
            line-height: 1;
        }

        /* محتوى العملة: الأسماء والرموز */
        .banknote-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            margin: 5px 0;
        }

        /* صندوق الأسماء المدمج في العملة */
        .names-currency-box {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 8px;
            padding: 10px 20px;
            text-align: center;
            flex-grow: 1;
            margin: 0 20px;
        }

        .currency-title {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 5px;
        }

        .currency-name-line {
            font-family: 'Amiri', serif;
            font-size: 20px;
            font-weight: 700;
            color: #f39c12;
            line-height: 1.3;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        /* الرقم التسلسلي الأمني للعملة */
        .serial-number {
            font-family: 'Courier Prime', monospace;
            font-size: 13px;
            color: #ff6b6b;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: left;
        }

        /* تذييل العملة */
        .banknote-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 2;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            padding-top: 8px;
        }

        .signatures {
            display: flex;
            gap: 25px;
        }

        .sig-block {
            text-align: center;
        }

        .sig-block .sig-line {
            width: 80px;
            height: 1px;
            background: #d4af37;
            margin: 2px 0;
        }

        .sig-block span {
            font-size: 9px;
            color: #cbd5e1;
        }

        .program-stamp {
            font-family: 'Reem Kufi', sans-serif;
            font-size: 16px;
            color: #ffffff;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            padding: 2px 15px;
            border-radius: 15px;
            color: #0d1b2a;
            font-weight: bold;
        }

        /* زر الطباعة */
        .print-btn {
            margin-top: 25px;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            color: #0d1b2a;
            border: none;
            padding: 12px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: all 0.3s ease;
        }

        .print-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }

        /* إعدادات الطباعة الاحترافية */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .print-btn {
                display: none;
            }
            .banknote {
                box-shadow: none;
                border: 1px solid #000;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <!-- تصميم العملة التذكارية الرسمية -->
    <div class="banknote">
        <div class="security-border">
            
            <!-- الشريط الأمني -->
            <div class="security-thread"></div>

            <!-- رأس العملة (العنوان والشعار والقيمة) -->
            <div class="banknote-header">
                <div class="issuer-title">
                    <h2>الهيئة الوطنية للإعلام</h2>
                    <h4>ماسبيرو - إصدار تذكاري خاص</h4>
                </div>
                <div class="logo-box">
                    <img src="https://i.postimg.cc/wT78XF7T/IMG-f539c8bf-f70b-46a7-bc1e-2cffc62be165.jpg" alt="شعار ماسبيرو">
                </div>
                <div class="denomination-top">VIP</div>
            </div>

            <!-- محتوى العملة (الأسماء متتالية والرقْم التسلسلي) -->
            <div class="banknote-body">
                <div class="names-currency-box">
                    <div class="currency-title">بطاقة اعتماد ورقية تذكارية - برنامج كلام شباب</div>
                    <div class="currency-name-line">الطالب / مؤمن هشام القصاص</div>
                    <div class="currency-name-line">الطالبة / ملك عبد العزيز الجندي</div>
                </div>

                <div>
                    <div class="serial-number">MASPÉRO #2026</div>
                    <div class="serial-number" style="margin-top: 15px; font-size: 11px;">SEC-AUTH</div>
                </div>
            </div>

            <!-- تذييل العملة (التواقيع وختم البرنامج) -->
            <div class="banknote-footer">
                <div class="signatures">
                    <div class="sig-block">
                        <span>إدارة البرنامج</span>
                        <div class="sig-line"></div>
                    </div>
                    <div class="sig-block">
                        <span>التلفزيون المصري</span>
                        <div class="sig-line"></div>
                    </div>
                </div>

                <div class="program-stamp">برنامج كلام شباب</div>
            </div>

        </div>
    </div>

    <!-- زر الطباعة أو الحفظ PDF -->
    <button class="print-btn" onclick="window.print()">🖨️ طباعة العملة التذكارية (PDF)</button>

</body>
</html>
